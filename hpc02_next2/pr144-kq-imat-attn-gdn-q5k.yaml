schema: bittrellis/manifest@2
track: HPC-02
name: pr144-kq-imat-attn-gdn-q5k
description: >
  #144's map (unsloth's routed gate/up, every routed down but layers 34, 38 and 39 on Q4_K, every attention
  projection and every Gated DeltaNet projection on Q5_K, lm_head and the embeddings on Q4_K: decode 479.8, the
  fastest measured map, 23.45 GiB) with every kq_rtn tensor rounded by the merged kq_imat instead. #144 failed the
  task guard at 558/784 on kq_rtn's rounding; on the pinned BF16 weights of layers 3, 12, 19 and 30, kq_imat
  brings the xtx-weighted Q5_K error of the attention q/k/v and recurrent qkv/z to 0.18-0.45 of kq_rtn's. The
  formats, and so decode, prefill and memory, are #144's.
default: Q8_0
encoders: {Q4_K: unsloth_ud, Q5_K: unsloth_ud, Q6_K: unsloth_ud, Q8_0: unsloth_ud}
rules:
  - match: "L*.exps.gate"
    format: Q4_K
  - match: "L*.exps.up"
    format: Q4_K
  - match: "L*.exps.down"
    format: Q4_K
    encoder: kq_imat
  - match: "L*.gdn.*"
    format: Q5_K
    encoder: kq_imat
  - match: "L*.attn.*"
    format: Q5_K
    encoder: kq_imat
modules:
  L34.exps.down: Q6_K
  L38.exps.down: Q6_K
  L39.exps.down: Q6_K
  lm_head: {format: Q4_K, encoder: kq_imat}
  embed: {format: Q4_K, encoder: kq_imat}
